extends: signal_v2_base.yaml

experiment:
  id: widar3_v2_preflight
  description: Real Widar3 save/eval/resume preflight before the full run

training:
  batch_size: 96
  eval_batch_size: 192
  num_workers: 4
  log_every_steps: 1
  eval_every_steps: 2
  save_every_steps: 2
  early_stopping_patience: 0
  subject_balanced_sampler:
    gestures_per_batch: 6
    subjects_per_gesture: 4
    samples_per_subject: 4
    batches_per_epoch: 4
