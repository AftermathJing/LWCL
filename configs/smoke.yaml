data:
  manifest: data/processed/synthetic/manifest_split.csv
  num_labels: 6
  num_receivers: 6
  input_features: 49
  max_seq_len: 64

model:
  channel_attention:
    output_dim: 64
    hidden_dim: 16
    dropout: 0.1
  hste:
    projection_dim: 64
    window_size: 8
    window_stride: 4
    local_heads: 4
    local_layers: 1
    output_dim: 128
    global_heads: 4
    global_layers: 1
    ffn_factor: 2
    dropout: 0.1
  adapter:
    num_layers: 1
    num_heads: 4
    ffn_factor: 2
    dropout: 0.1
  backbone:
    type: tiny
    hidden_size: 128
    num_layers: 1
    num_heads: 4
    ffn_factor: 2
    dropout: 0.1

training:
  seed: 2025
  device: auto
  precision: fp32
  epochs: 3
  max_steps: 6
  batch_size: 4
  eval_batch_size: 8
  num_workers: 0
  balanced_sampling: true
  learning_rate: 0.0003
  backbone_learning_rate: 0.0001
  weight_decay: 0.01
  warmup_steps: 1
  gradient_accumulation_steps: 1
  gradient_clip_norm: 1.0
  log_every_steps: 1
  eval_every_steps: 2
  save_every_steps: 2
  trainable_only_checkpoints: false
