extends: signal_v2_base.yaml

experiment:
  id: smoke
  description: Six-step save/eval/resume/emergency validation

data:
  manifest: data/synthetic_smoke/manifest.csv
  max_seq_len: 48

training:
  batch_size: 24
  eval_batch_size: 48
  num_workers: 2
  epochs: 2
  max_steps: 6
  log_every_steps: 1
  eval_every_steps: 2
  save_every_steps: 2
  early_stopping_patience: 0
  subject_balanced_sampler:
    gestures_per_batch: 6
    subjects_per_gesture: 2
    samples_per_subject: 2
    batches_per_epoch: 4
