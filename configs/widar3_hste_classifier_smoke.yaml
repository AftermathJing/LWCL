data:
  manifest: data/splits/widar3_subject_split.csv
  num_labels: 6
  num_receivers: 6
  input_features: 49
  max_seq_len: 64

model:
  architecture: hste_classifier
  channel_attention:
    output_dim: 64
    hidden_dim: 16
    dropout: 0.1
  hste:
    projection_dim: 64
    window_size: 4
    window_stride: 2
    local_heads: 4
    local_layers: 1
    output_dim: 128
    global_heads: 4
    global_layers: 1
    ffn_factor: 2
    dropout: 0.1
  classifier:
    hidden_dim: 128
    pooling: attention
    dropout: 0.1
    label_smoothing: 0.0

training:
  seed: 2025
  device: cuda
  precision: bf16
  epochs: 2
  max_steps: 6
  batch_size: 64
  eval_batch_size: 128
  num_workers: 4
  balanced_sampling: true
  learning_rate: 0.0005
  classifier_learning_rate: 0.001
  weight_decay: 0.01
  warmup_steps: 2
  gradient_accumulation_steps: 1
  gradient_clip_norm: 1.0
  log_every_steps: 1
  eval_every_steps: 2
  save_every_steps: 2
  early_stopping_patience: 0
  trainable_only_checkpoints: false
